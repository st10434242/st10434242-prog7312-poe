server {
    listen 80;

    # The SPA owns its own routes, so an unknown path still has to serve index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxied so the browser sees one origin and CORS never comes into it
    location /api/ {
        proxy_pass http://api:8080;
    }

    # SignalR needs the connection upgraded, otherwise it falls back to long polling
    location /hub/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
