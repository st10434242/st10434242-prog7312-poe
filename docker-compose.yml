services:
  api:
    build:
      context: .
      dockerfile: SmartX.Api/Dockerfile
    ports:
      - "5225:8080"
    environment:
      # Without a key the gateway generates a temporary one and warns, which means
      # uploaded files stop being readable after a restart. Set it in a .env file.
      - Attachments__Key=${ATTACHMENTS_KEY:-}
      - Attachments__Directory=/app/uploads
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    build:
      context: .
      dockerfile: SmartX.Simulator/Dockerfile
    environment:
      - Simulator__ApiBaseUrl=http://api:8080
    # Waits for the health check rather than just for the container to exist
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: ./smartx-dashboard
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  uploads:
